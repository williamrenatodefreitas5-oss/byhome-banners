name: Garimpar ofertas de marca

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = 3 marcas por categoria + amostras cruas; completo = todas as marcas"
        default: "teste"
        type: choice
        options: [teste, completo]
      categoria:
        description: "Opcional: automotivo, casa-tech, tecnologia-pc, celular-acessorios, celulares, livros"
        default: ""
      marketplaces:
        description: "shopee,ml"
        default: "shopee,ml"
  # schedule:
  #   - cron: "0 9 * * *"   # 06:00 BRT (ligar depois do teste)

permissions:
  contents: write

jobs:
  garimpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Garimpar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python scripts/garimpar.py --modo "${{ inputs.modo }}" --categoria "${{ inputs.categoria }}" --marketplaces "${{ inputs.marketplaces }}"
      - name: Salvar resultados no repositorio
        run: |
          git config user.name "byhome-bot"
          git config user.email "byhome-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Garimpeiro: resultados $(date -u +%F)"
          git push
