name: Postar no Instagram (3x ao dia)

on:
  schedule:
    # GitHub usa UTC. Brasilia = UTC-3.
    - cron: "0 9 * * *"    # 06:00
    - cron: "30 14 * * *"  # 11:30
    - cron: "0 20 * * *"   # 17:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular (nao publica)"
        type: boolean
        default: true
      categoria:
        description: "Forcar categoria (id de data/links.json, ex.: motos). Vazio = automatica"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: postar-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gerar legenda e publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          CATEGORIA: ${{ github.event.inputs.categoria }}
        run: python scripts/postar_instagram.py
